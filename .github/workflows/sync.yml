name: sync-and-deploy

on:
    schedule:
        - cron: '0 18 * * *'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: sync-and-deploy
    cancel-in-progress: false

jobs:
    sync:
        runs-on: ubuntu-latest
        # fetchBlogger paginates in an unbounded loop and neither fetcher passes
        # an abort signal, so a hung upstream would otherwise hold a runner for
        # the 6-hour default — and cancel-in-progress: false queues tomorrow's
        # run behind it.
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: yarn

            - run: yarn install --frozen-lockfile

            # Paths in scripts/sync.ts are relative to the repo root, so this
            # step must run there — no working-directory. A dead or empty feed
            # makes the fetchers throw, failing the job before anything is
            # written, which leaves the previous data/posts.json in place.
            - name: Sync feeds
              run: yarn sync

            # After sync on purpose: the suite asserts against the real index,
            # so it also guards against the feeds coming back malformed.
            - name: Run tests
              run: yarn test

            # yarn sync is byte-idempotent, so a dirty posts.json means the
            # feeds actually changed. Never format this file: it is in
            # .prettierignore because prettier collapses the generated tag
            # arrays and every run would commit a spurious whole-file diff.
            - name: Commit index when it changed
              run: |
                  if git diff --quiet data/posts.json; then
                      echo "no new posts"
                  else
                      git config user.name "github-actions[bot]"
                      git config user.email "github-actions[bot]@users.noreply.github.com"
                      git add data/posts.json
                      git commit -m "chore: sync posts index"
                      git push
                  fi

            # The 404.html copy mirrors `predeploy`: BrowserRouter needs an SPA
            # fallback because GitHub Pages has no rewrite rules.
            - name: Build
              run: |
                  yarn build
                  cp dist/index.html dist/404.html

            - uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./dist
